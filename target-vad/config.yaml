core:
  vad:
    sample_rate: 16000
    chunk_duration_ms: 30
    speech_threshold: 0.5
    min_speech_duration_ms: 300
    padding_ms: 200

  speaker:
    threshold: 0.75
    min_segment_duration_ms: 800
    enrollment_utterances: 5
    # Raised 0.6 -> 0.80 (Director verify-before-serve, Plan 05): 0.6 admitted
    # drifty enrollments that later false-rejected the real user; 0.80 matches the
    # ~2% EER operating point on >=5s cumulative audio. Reject + re-enroll below
    # this (bounded by enrollment_max_retries).
    enrollment_min_self_similarity: 0.80
    enrollment_max_retries: 3

  audio:
    device_index: null
    channels: 1
    sample_rate: 16000
    chunk_size: 480

  paths:
    voiceprints_dir: "./voiceprints"
    silero_model_path: null

kiosk:
  wake_phrase: "hey_mycroft"
  wake_threshold: 0.5
  awaiting_speech_timeout_s: 15
  decision_smoother:
    window_size: 3
    min_matches: 2
    threshold: 0.50   # tuned for C10 + classroom DSP; raise once non-self baseline measured

  talkback_enabled: false

  talkback:
    sample_rate_hz: 16000
    frame_ms: 10
    output_device: null
    input_device: null

    # Active-conversation timeouts, owned by the Director (the SOLE timeout
    # authority — spec section 4a). silence_timeout_s: how long a pause between
    # your turns ends the session. hard_timeout_s: absolute session cap. The old
    # kiosk.session_*_timeout_s keys (a second, racing authority) are DELETED.
    silence_timeout_s: 30
    hard_timeout_s: 300

    # Director verify-before-serve (Plan 05): refuse to start a session when the
    # finalized primary embedding disagrees with the pre-finalize holdout utterance
    # (cosine < threshold) -> return to IDLE + re-enroll rather than serving a bad
    # voiceprint. 0.80 = ~2% EER on >=5s cumulative audio.
    verify_before_serve_threshold: 0.80
    # De-risked lockout: after an EJECT, accept a fresh wake once there has been no
    # near-field RMS for this long (never a permanent lockout).
    lockout_idle_after_s: 5

    aec:
      enabled: true
      suppression_level: "high"

    stt:
      # Re-backed off faster-whisper (no aarch64 CUDA wheel on GB10) onto
      # openai-whisper (torch, CUDA). See docs/notes/2026-06-22-stt-backend.md.
      backend: "openai-whisper"   # "openai-whisper" (proven on GB10) | "nemo" (Plan 04 Task 7)
      model: "small.en"           # GB10 p95: tiny 67ms / base.en 84ms / small.en 189ms / medium.en 415ms (word_timestamps on, self.wav 3s). small.en = accuracy/latency balance for uncommon words
      device: "cuda"              # GB10 CUDA; fallback is NOT supported (faster-whisper banned)
      partials_every_ms: 300      # reserved (no streaming-partial path in V1; full-segment STT)
      end_of_utterance_tail_ms: 400
      # mean_word_prob from StreamingStt feeds the Director's empty/low-confidence
      # RESTORE guard: transcripts with mean_word_prob < barge_in.conf_floor (0.5)
      # are treated as non-content and RESTORE rather than CUT (spec Section 6).

    llm:
      base_url: "http://127.0.0.1:8080/v1"
      model: "gemma-3-4b-it"
      temperature: 0.6
      max_tokens: 512
      system_prompt: |
        You are a concise voice assistant. Replies should be 1-3 sentences,
        natural-sounding, and avoid lists, code blocks, or markdown.

    tts:
      backend: "kokoro"
      voice: "af_bella"
      device: "cuda"

    chunker:
      sentence_terminators: [".", "?", "!"]
      max_chunk_chars: 120

    # Per-turn speaker lock: NEW turns (not just barge-in) must match the
    # enrolled primary speaker, else a bystander who speaks in the gap between
    # TTS replies would be transcribed and answered.
    #
    # ECAPA cosine on a SINGLE conversational turn (~0.3-1.5s) can't separate
    # the enrolled speaker from a bystander — live scores scatter from -0.14 to
    # 0.60 for both, so no per-turn threshold works. Similarity is reliable only
    # on longer audio (offline self vs other: 2.0s -> thr 0.30 gives ~100%
    # accept-self / ~100% reject-other). So we DON'T judge turns alone:
    # consecutive turn audio accumulates into a rolling buffer and, once it
    # reaches verify_window_ms, the whole window is embedded and scored at once.
    # Sub-window turns are served provisionally (logged turn_gate_pending) and
    # fed into the next window, so a brief utterance never false-rejects the
    # real user. A bystander leaks until the window fills, then it rejects and
    # the M-of-N lockout ends the session. See docs/speaker-gate-measurement.md;
    # inspect live scores with `bench/speaker_scores.py --source turn_gate`.
    turn_gate:
      require_speaker_match: true
      speaker_threshold: 0.30      # tuned for >=2s windows (offline ~100%/100%)
      verify_window_ms: 2000       # accumulate consecutive turn audio to this, then verify

      # M-of-N lockout: end the session when verified WINDOW scores stop matching
      # the primary (a hijacker). Window over verified window scores; lockout
      # when fewer than min_matches of the last window_size cross the threshold.
      # Default (1 of 3) ends the session after 3 consecutive rejecting windows
      # (~6s of non-matching speech) — near-certain for a bystander, vanishingly
      # rare for the real user at the >=2s window false-reject rate.
      lockout:
        enabled: true
        window_size: 3
        min_matches: 1

    # Barge-in: the registered user (session primary) can interrupt the AI
    # mid-reply; all other speakers and crowd noise are ignored. Verification
    # needs low echo, so on near-field speech onset we DUCK the TTS, capture a
    # clean window, verify, then CUT (user) or RESTORE (bystander/noise).
    #
    # speaker_threshold is provisional: prior barge-in scores were collected
    # with AEC effectively off (playback bypassed the player's reference ring
    # buffer, so AEC cancelled against silence — 0/159 barge-ins ever succeeded).
    # That is fixed; re-measure during ducked playback and retune:
    #   bench/speaker_scores.py --source barge_in
    barge_in:
      enabled: true
      require_speaker_match: true
      min_speech_ms: 120
      speaker_threshold: 0.20      # provisional; live barge-ins (AEC on) scored ~0.12-0.41
      verify_window_ms: 700        # 1200 rejected most real barge-ins as too_short; proximity guards bystanders
      duck_level: 0.35             # TTS gain while capturing an interruption; partial (not near-silent) so a rejected interjection doesn't lose the reply's tail. Watch: louder duck = more self-voice in the mic for AEC to cancel
      duck_ramp_ms: 120
      proximity:
        enabled: true              # ignore speech too quiet to be someone at the kiosk
        rms_threshold: null        # null = auto-calibrate from the primary enrollment RMS
        rms_factor: 0.5

    # Crowd focus (Plan 05): a personal-VAD (FireRedChat pVAD, ONNX/CPU)
    # conditioned on the enrolled ECAPA embedding makes is_target real — only the
    # enrolled speaker's turns/onsets are served; bystanders are ignored. If the
    # model can't load (offline/uncached) the kiosk falls back to is_target=True
    # (legacy single-speaker behavior). The pVAD's own RMS crash-fallback covers a
    # mid-session failure (is_target := rms >= proximity_rms).
    crowd_focus:
      enabled: true
      threshold: 0.5             # per-frame target-speaker prob >= this => target

    # Interruption-resume: after answering an interruption, the AI offers to
    # continue the prior topic and, on confirmation, resumes from where it left
    # off. Controller owns the resume lifecycle; the LLM phrases the offer and
    # continuation. See docs/superpowers/specs/2026-06-12-verified-bargein-resume-design.md
    resume:
      enabled: true

    logging:
      jsonl_path: "logs/kiosk-{date}-{session_id}.jsonl"
      include_partial_transcripts: false

diarization:
  identification_threshold: 0.55
  pyannote_pipeline: "pyannote/speaker-diarization-3.1"
  hf_token_env_var: "HF_TOKEN"
  centroid_max_sample_seconds: 30
  intro_override_warn_threshold: 0.30   # warn if intro voiceprint disagrees with same-id persistent voiceprint
  unknown_min_segments: 2          # minimum segment count for a recurring-unknown cluster to keep its pyannote id
  unknown_min_seconds: 10.0        # minimum total talk seconds for a recurring-unknown cluster to keep its pyannote id

transcription:
  model: "small"              # preset shortcut or any faster-whisper-compatible model identifier
  language: "en"              # ISO 639-1 code; set to null to let whisper auto-detect per call
  initial_prompt_chars: 200   # rolling-context window passed to whisper.transcribe(initial_prompt=...)
  device: "cpu"               # "cpu" on this hardware; "cuda" is reserved for future GPU work
  compute_type: "int8"        # int8 quantization is CPU-optimal; "float32" trades ~2x speed for ~1% WER

sentiment:
  polarity_model: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  emotion_model: "j-hartmann/emotion-english-distilroberta-base"
  device: "cpu"
  batch_size: 16

metrics:
  bucket_seconds: 300         # 5-min activity buckets
  top_k_highlights: 5         # cap on Notable moments items
  quote_max_chars: 100        # quote truncation length in highlights

prosody:
  pitch_min_hz: 80           # pyin floor - typical human speech floor
  pitch_max_hz: 400          # pyin ceiling - typical adult speech ceiling
  frame_length_ms: 25        # standard speech-analysis window
  hop_length_ms: 10          # standard 60% overlap
