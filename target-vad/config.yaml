core:
  vad:
    sample_rate: 16000
    chunk_duration_ms: 30
    speech_threshold: 0.5
    min_speech_duration_ms: 300
    padding_ms: 200

  speaker:
    threshold: 0.75
    min_segment_duration_ms: 800
    enrollment_utterances: 5
    enrollment_min_self_similarity: 0.6
    enrollment_max_retries: 3

  audio:
    device_index: null
    channels: 1
    sample_rate: 16000
    chunk_size: 480

  paths:
    voiceprints_dir: "./voiceprints"
    silero_model_path: null

kiosk:
  wake_phrase: "hey_jarvis"
  wake_threshold: 0.5
  awaiting_speech_timeout_s: 5
  session_silence_timeout_s: 10
  session_hard_timeout_s: 300
  decision_smoother:
    window_size: 3
    min_matches: 2
    threshold: 0.50   # tuned for C10 + classroom DSP; raise once non-self baseline measured

diarization:
  identification_threshold: 0.55
  pyannote_pipeline: "pyannote/speaker-diarization-3.1"
  hf_token_env_var: "HF_TOKEN"
  centroid_max_sample_seconds: 30
  intro_override_warn_threshold: 0.30   # warn if intro voiceprint disagrees with same-id persistent voiceprint

transcription:
  model: "small"              # preset shortcut or any faster-whisper-compatible model identifier
  language: "en"              # ISO 639-1 code; set to null to let whisper auto-detect per call
  initial_prompt_chars: 200   # rolling-context window passed to whisper.transcribe(initial_prompt=...)
  device: "cpu"               # "cpu" on this hardware; "cuda" is reserved for future GPU work
  compute_type: "int8"        # int8 quantization is CPU-optimal; "float32" trades ~2x speed for ~1% WER

sentiment:
  polarity_model: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  emotion_model: "j-hartmann/emotion-english-distilroberta-base"
  device: "cpu"
  batch_size: 16

metrics:
  bucket_seconds: 300         # 5-min activity buckets
  top_k_highlights: 5         # cap on Notable moments items
  quote_max_chars: 100        # quote truncation length in highlights
