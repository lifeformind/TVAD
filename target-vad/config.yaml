core:
  vad:
    sample_rate: 16000
    chunk_duration_ms: 30
    speech_threshold: 0.5
    min_speech_duration_ms: 300
    padding_ms: 200

  speaker:
    threshold: 0.75
    min_segment_duration_ms: 800
    enrollment_utterances: 5
    # Raised 0.6 -> 0.80 (Director verify-before-serve, Plan 05): 0.6 admitted
    # drifty enrollments that later false-rejected the real user; 0.80 matches the
    # ~2% EER operating point on >=5s cumulative audio. Reject + re-enroll below
    # this (bounded by enrollment_max_retries).
    enrollment_min_self_similarity: 0.80
    enrollment_max_retries: 3

  audio:
    # Capture goes through PipeWire; the mic is whatever PipeWire's default
    # source is — kept on the ReSpeaker 4 Mic Array (the production mic; the
    # C10 is camera duty). PortAudio cannot open the array directly, so
    # "pipewire" is the only path. Far-field array => proximity floors run
    # ~0.01 (vs ~0.06 near-field C10); do not compare floors across mics.
    device_index: "pipewire"
    channels: 1
    sample_rate: 16000
    chunk_size: 480

  paths:
    voiceprints_dir: "./voiceprints"
    silero_model_path: null

kiosk:
  wake_phrase: "hey_mycroft"
  wake_threshold: 0.5
  awaiting_speech_timeout_s: 15

  talkback_enabled: false

  talkback:
    sample_rate_hz: 16000
    frame_ms: 10
    # Director-10: TTS plays through the ReSpeaker's playback path so the
    # XVF-3000's onboard AEC cancels the kiosk's own voice against its ch5
    # reference IN HARDWARE (kills Bug A: TTS bleed served / self-replies).
    # The powered speaker hangs off the array's 3.5mm jack. Name substring,
    # resolved against PortAudio OUTPUT devices at startup; resolution
    # failure refuses to start (exit 4) — never fall back silently, a
    # routing drift would resurrect Bug A invisibly. NB PortAudio's device
    # name does not contain the ALSA card id "ArrayUAC10". null = system
    # default (legacy best-effort). (input_device key deleted: never read.)
    output_device: "ReSpeaker"

    # Active-conversation timeouts, owned by the Director (the SOLE timeout
    # authority — spec section 4a). silence_timeout_s: how long a pause between
    # your turns ends the session. hard_timeout_s: absolute session cap. The old
    # kiosk.session_*_timeout_s keys (a second, racing authority) are DELETED.
    silence_timeout_s: 30
    hard_timeout_s: 300
    # Nudge fires this many seconds BEFORE silence_timeout ("are you still
    # there?"). Read by the Director reducer; was previously a silent default.
    nudge_lead_s: 5.0
    # Watchdog tick cadence (ms) — the Director's single clock source.
    watchdog:
      tick_ms: 500

    # Verify-before-serve (Director-09): split-half self-similarity of the FIRST
    # segment (same-utterance halves; only runs on segments >=1.0s). Below this
    # -> refuse to serve (no session), re-wake immediately. Cross-utterance
    # verification is the safety net's window-1 job (turn_gate below).
    verify_before_serve_threshold: 0.80
    # After a speaker_mismatch EJECT, accept a fresh wake only once the near
    # field has been quiet this long (never a permanent lockout). Director-09.
    lockout_idle_after_s: 5

    aec:
      # Director-10: OFF — TTS plays through the array, whose onboard AEC
      # cancels it in hardware before ch0 reaches our capture path. The
      # software-AEC code path is kept intact and dormant; flip true only
      # if TTS ever plays through a non-array output again.
      enabled: false

    stt:
      # Re-backed off faster-whisper (no aarch64 CUDA wheel on GB10) onto
      # openai-whisper (torch, CUDA). See docs/notes/2026-06-22-stt-backend.md.
      backend: "openai-whisper"   # "openai-whisper" (proven on GB10) | "nemo" (Plan 04 Task 7)
      model: "small.en"           # GB10 p95: tiny 67ms / base.en 84ms / small.en 189ms / medium.en 415ms (word_timestamps on, self.wav 3s). small.en = accuracy/latency balance for uncommon words
      device: "cuda"              # GB10 CUDA; fallback is NOT supported (faster-whisper banned)
      end_of_utterance_tail_ms: 400
      # mean_word_prob from StreamingStt feeds the Director's empty/low-confidence
      # RESTORE guard: transcripts with mean_word_prob < barge_in.conf_floor (0.5)
      # are treated as non-content and RESTORE rather than CUT (spec Section 6).

    llm:
      base_url: "http://127.0.0.1:8080/v1"
      model: "gemma-3-4b-it"
      temperature: 0.6
      max_tokens: 512
      system_prompt: |
        You are a concise voice assistant. Replies should be 1-3 sentences,
        natural-sounding, and avoid lists, code blocks, or markdown.

    tts:
      backend: "kokoro"
      voice: "af_bella"
      device: "cuda"

    chunker:
      sentence_terminators: [".", "?", "!"]
      max_chunk_chars: 120

    # Director-09 speaker safety net: NEW turns already pass the bystander gate
    # (reject_bystanders below); this layer catches what proximity+camera can't —
    # a session hijack / close loud bystander. Consecutive SERVED turn audio
    # accumulates; every verify_window_ms window is ECAPA-scored against the
    # primary (short single turns are never judged alone — see
    # docs/speaker-gate-measurement.md). Window 1 failing = bad enrollment ->
    # session ends (enroll_verify_failed). Later: 3 consecutive failing windows
    # (M-of-N below) = WARN (log-only); a second consecutive smoother-fail that
    # is ALSO below the proximity floor = silent EJECT (speaker_mismatch).
    turn_gate:
      require_speaker_match: true  # master enable (strict-bool; only real `true`)
      speaker_threshold: 0.15      # live-tuned 2026-07-06 (was 0.30, offline-derived):
                                   # owner 2s windows score 0.230-0.466 live (array mic,
                                   # interjection windows carry TTS bleed); stranger scored
                                   # 0.069. 0.30 sat inside the owner band -> two window-1
                                   # false ejects. 0.15 = midpoint of the live gap.
      verify_window_ms: 2000       # accumulate served turn audio to this, then verify
      endpoint_threshold: 0.5      # Smart Turn endpoint_prob >= this => turn complete
      # Bystander gate v1 (Director-08): reject NON-owner NEW turns by proximity +
      # camera presence (reject-by-default, "never answer a stranger"). Fail-safe:
      # rejects only when too quiet/distant OR owner ABSENT from frame; PRESENT and
      # UNAVAILABLE both allow. Off in code by default (no-regression); shipped on
      # here. Only a real boolean true enables (the 'flase' lesson).
      reject_bystanders: true
      # EJECT authority. false = shadow mode: verdicts + WARN DIAG, no session
      # ends — the graduated-rollout knob. window_size/min_matches = the M-of-N
      # smoother over window scores (1-of-3: fails only after 3 consecutive
      # misses ~6s of served non-matching speech).
      lockout:
        enabled: true
        window_size: 3
        min_matches: 1

    # Barge-in: the registered user (session primary) can interrupt the AI
    # mid-reply; all other speakers and crowd noise are ignored. Verification
    # needs low echo, so on near-field speech onset we DUCK the TTS, capture a
    # clean window, verify, then CUT (user) or RESTORE (bystander/noise).
    #
    # speaker_threshold is provisional: prior barge-in scores were collected
    # with AEC effectively off (playback bypassed the player's reference ring
    # buffer, so AEC cancelled against silence — 0/159 barge-ins ever succeeded).
    # That is fixed; re-measure during ducked playback and retune:
    #   bench/speaker_scores.py --source barge_in
    barge_in:
      enabled: true
      min_speech_ms: 120
      speaker_threshold: 0.20      # provisional; live barge-ins (AEC on) scored ~0.12-0.41
      conf_floor: 0.5              # interjection mean_word_prob below this => RESTORE
      verify_window_ms: 700        # 1200 rejected most real barge-ins as too_short; proximity guards bystanders
      duck_level: 0.35             # TTS gain while capturing an interruption; partial (not near-silent) so a rejected interjection doesn't lose the reply's tail. Watch: louder duck = more self-voice in the mic for AEC to cancel
      duck_ramp_ms: 120
      proximity:
        enabled: true              # ignore speech too quiet to be someone at the kiosk
        rms_threshold: null        # null = auto-calibrate from the primary enrollment RMS
        rms_factor: 0.5

    # Crowd focus (Plan 05): DISABLED — the FireRedChat pVAD's spkemb conditioning
    # is inert with our speechbrain/spkrec-ecapa-voxceleb embeddings, so it provides
    # NO speaker selectivity (degenerates to a plain energy VAD; bystanders leak).
    # Root-caused 2026-06-23: the encoder + full recipe match FireRedChat's public
    # plugin exactly, yet target ~0.61 vs bystander ~0.55 (both > 0.5 threshold) —
    # not a preprocessing bug, the conditioning is genuinely too weak to gate. See
    # memory pvad-conditioning-inert. With this off, _build_pvad returns None and
    # the kiosk runs proximity-RMS-only (is_target=True); crowd focus is being
    # rebuilt on ECAPA accumulated-window verification (turn_gate, below).
    crowd_focus:
      enabled: false
      threshold: 0.5             # per-frame target-speaker prob >= this => target

    # Camera floor control (Director-07). Presence is the floor authority: keep
    # serving the owner, free the kiosk fast when they physically leave, treat a
    # stranger as the owner leaving. ADD-ON: the silence_timeout above is unchanged.
    # CPU-only YuNet+SFace (no insightface); see docs/notes/2026-06-23-vision-presence.md.
    vision:
      enabled: true
      camera_index: 0
      width: 640                # spike-validated mode; do NOT set CAP_PROP_FPS
      height: 360
      fps: 3                    # low-rate dedicated capture (detection ~2% of a core)
      identity_threshold: 0.40  # spike Tier-2 GO: self >=0.79 vs stranger <=0.06
      min_area_frac: 0.015      # zone/size gate at 640x360
      present_after_s: 1.0      # debounce hysteresis -> PRESENT
      absent_after_s: 2.0       # debounce hysteresis -> ABSENT
      owner_absent_grace_s: 3.0 # sustained ABSENT this long => free the kiosk
      active_talk_guard_s: 3.0  # never owner-absent-end within this of owner speech
      enroll_frames: 8          # owner face-reference frames captured at session start

    logging:
      jsonl_path: "logs/kiosk-{date}-{session_id}.jsonl"

diarization:
  identification_threshold: 0.55
  pyannote_pipeline: "pyannote/speaker-diarization-3.1"
  hf_token_env_var: "HF_TOKEN"
  centroid_max_sample_seconds: 30
  intro_override_warn_threshold: 0.30   # warn if intro voiceprint disagrees with same-id persistent voiceprint
  unknown_min_segments: 2          # minimum segment count for a recurring-unknown cluster to keep its pyannote id
  unknown_min_seconds: 10.0        # minimum total talk seconds for a recurring-unknown cluster to keep its pyannote id

transcription:
  model: "small"              # preset shortcut or any faster-whisper-compatible model identifier
  language: "en"              # ISO 639-1 code; set to null to let whisper auto-detect per call
  initial_prompt_chars: 200   # rolling-context window passed to whisper.transcribe(initial_prompt=...)
  device: "cpu"               # "cpu" on this hardware; "cuda" is reserved for future GPU work
  compute_type: "int8"        # int8 quantization is CPU-optimal; "float32" trades ~2x speed for ~1% WER

sentiment:
  polarity_model: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  emotion_model: "j-hartmann/emotion-english-distilroberta-base"
  device: "cpu"
  batch_size: 16

metrics:
  bucket_seconds: 300         # 5-min activity buckets
  top_k_highlights: 5         # cap on Notable moments items
  quote_max_chars: 100        # quote truncation length in highlights

prosody:
  pitch_min_hz: 80           # pyin floor - typical human speech floor
  pitch_max_hz: 400          # pyin ceiling - typical adult speech ceiling
  frame_length_ms: 25        # standard speech-analysis window
  hop_length_ms: 10          # standard 60% overlap
